get:
  operationId: stocksGetInsiderTrades
  tags:
    - news-events
  summary: Giao dịch nội bộ / cổ đông lớn
  description: |
    Giao dịch công bố của người nội bộ, cổ đông lớn và người có liên quan của 1 mã: ai giao dịch, chức vụ, khối lượng đăng ký / đã thực hiện, tỷ lệ sở hữu sau giao dịch.

    Đây là DANH SÁCH SỰ KIỆN công bố, không phải chuỗi số liệu theo phiên. `from`/`to` (dạng `YYYY-MM-DD`) lọc theo ngày công bố; bỏ trống → 1 năm gần nhất. Phân trang qua `page`/`page_size` (tối đa 50).
  parameters:
    - name: symbol
      in: path
      required: true
      description: 'Mã cổ phiếu niêm yết (3–10 ký tự chữ/số, không phân biệt hoa thường). VD: VNM, FPT.'
      schema:
        type: string
        example: VNM
    - name: from
      in: query
      required: false
      description: Ngày bắt đầu (bao gồm), dạng `YYYY-MM-DD`. Bỏ trống → `to` trừ 1 năm.
      schema:
        type: string
        format: date
        example: '2026-01-01'
    - name: to
      in: query
      required: false
      description: Ngày kết thúc (bao gồm), dạng `YYYY-MM-DD`. Bỏ trống → hôm nay.
      schema:
        type: string
        format: date
        example: '2026-03-31'
    - name: side
      in: query
      required: false
      description: Lọc theo chiều giao dịch. Bỏ trống → mọi chiều.
      schema:
        $ref: "../../components/schemas/market/InsiderTradeSide.yaml"
    - name: status
      in: query
      required: false
      description: Lọc theo trạng thái. Bỏ trống → mọi trạng thái.
      schema:
        $ref: "../../components/schemas/market/InsiderTradeStatus.yaml"
    - name: page
      in: query
      required: false
      description: Trang cần lấy, bắt đầu từ 1. Mặc định `1`.
      schema:
        type: integer
        minimum: 1
        example: 1
    - name: page_size
      in: query
      required: false
      description: Số bản ghi mỗi trang, tối đa 50. Mặc định `20`.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        example: 20
  responses:
    '200':
      description: '`data.data` là danh sách giao dịch nội bộ của trang hiện tại.'
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/market/StockInsiderTradeListResponse.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '429':
      $ref: "../../components/responses/RateLimited.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
  x-codeSamples:
    - lang: bash
      label: cURL
      source: |
        curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
          "https://open-api.fhsc.com.vn/market/stocks/VNM/trading/insider?from=2026-01-01&to=2026-03-31"
