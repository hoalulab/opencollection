get:
  operationId: sectorsGetConstituents
  tags:
    - market-data
  summary: Danh sách mã trong ngành
  description: |
    Các mã thuộc một ngành kèm tỷ trọng theo vốn hoá và vốn hoá tính từ quote hiện tại.
  parameters:
    - name: slug
      in: path
      required: true
      description: Slug ngành cấp 1. Tra danh sách hợp lệ qua `GET /market/sectors`.
      schema:
        type: string
        enum:
          - technology
          - telecommunications
          - healthcare
          - financials
          - real-estate
          - consumer-discretionary
          - consumer-staples
          - industrials
          - basic-materials
          - energy
          - utilities
        example: financials
    - name: sort
      in: query
      required: false
      description: "Field sắp xếp, thêm `-` ở đầu để giảm dần. Mặc định `-weight_percent`. Field hợp lệ: weight_percent, market_cap, symbol."
      schema:
        type: string
        enum:
          - weight_percent
          - "-weight_percent"
          - market_cap
          - "-market_cap"
          - symbol
          - "-symbol"
        example: "-market_cap"
    - name: page
      in: query
      required: false
      description: Trang cần lấy, bắt đầu từ 1.
      schema:
        type: integer
        minimum: 1
        example: 1
    - name: page_size
      in: query
      required: false
      description: Số mã mỗi trang, tối đa 50.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        example: 20
  responses:
    "200":
      description: "`data.items` là danh sách mã trong ngành."
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/market/SectorConstituentsResponse.yaml"
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "404":
      $ref: "../../components/responses/NotFound.yaml"
    "429":
      $ref: "../../components/responses/RateLimited.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
  x-codeSamples:
    - lang: bash
      label: cURL
      source: |
        curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
          "https://open-api.fhsc.com.vn/market/sectors/financials/constituents?sort=-market_cap"
