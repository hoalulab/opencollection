get:
  operationId: stocksGetTrading
  tags:
    - market-data

  summary: Giao dịch tổng (phiên gần nhất)
  description: |
    Khối lượng và giá trị giao dịch của 1 mã trong một phiên, tách theo phương thức: `matched` (khớp lệnh) + `put_through` (thoả thuận) = `total`.

    Khác với giá: đây là dòng giao dịch, không phải OHLCV — giá xem ở `/market/quotes/stocks/{symbol}`.
  parameters:
    - name: symbol
      in: path
      required: true
      description: "Mã cổ phiếu niêm yết (3–10 ký tự chữ/số, không phân biệt hoa thường). VD: VNM, FPT."
      schema:
        type: string
        example: HPG
  responses:
    "200":
      description: "`data` là giao dịch tổng của phiên."
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/market/StockTradingResponse.yaml"
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "404":
      $ref: "../../components/responses/NotFound.yaml"
    "429":
      $ref: "../../components/responses/RateLimited.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
  x-codeSamples:
    - lang: bash
      label: cURL
      source: |
        curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
          "https://open-api.fhsc.com.vn/market/stocks/HPG/trading"
