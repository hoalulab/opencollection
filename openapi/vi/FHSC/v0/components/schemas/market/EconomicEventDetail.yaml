type: object
description: |
  Phần đặc thù của sự kiện vĩ mô (`type = ECONOMIC`). Các số liệu đã bỏ ký hiệu
  đơn vị; `unit` cho biết đơn vị dùng chung cho `actual`, `previous`,
  `consensus` và `forecast`.
required:
  - date
  - category
properties:
  date:
    type: string
    format: date-time
    description: Thời điểm diễn ra sự kiện, ISO 8601 kèm offset (giờ Việt Nam).
    example: "2026-07-29T01:00:00+07:00"
  category:
    type: string
    description: Phân loại sự kiện (ví dụ "Interest Rate", "Inflation", "Employment").
    example: Interest Rate
  actual:
    type:
      - string
      - "null"
    description: Số liệu thực tế đã công bố, không kèm ký hiệu đơn vị. `null` khi sự kiện chưa diễn ra hoặc nguồn chưa có số.
    example: "5.50"
  previous:
    type:
      - string
      - "null"
    description: Số liệu kỳ trước, không kèm ký hiệu đơn vị. `null` nếu nguồn không có.
    example: "5.25"
  consensus:
    type:
      - string
      - "null"
    description: Đồng thuận thị trường (consensus), không kèm ký hiệu đơn vị. `null` nếu nguồn không có.
    example: "5.50"
  forecast:
    type:
      - string
      - "null"
    description: Dự báo nhà phân tích, không kèm ký hiệu đơn vị. `null` nếu nguồn không có.
    example: "5.50"
  unit:
    type: string
    description: Đơn vị chung của các số liệu, ví dụ `Percent`, `Thousand`, `USD Billion`.
    example: Percent
