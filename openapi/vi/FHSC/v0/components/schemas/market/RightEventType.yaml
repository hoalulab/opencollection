  - STOCK_MERGE
  - RIGHTS_OFFERING
  - BOND_INTEREST
  - BOND_PRINCIPAL_INTEREST
  - BOND_TO_STOCK_CONVERSION
  - RIGHT_TO_STOCK_CONVERSION
  - EXCHANGE_TRANSFER
  - STOCK_TO_STOCK_CONVERSION
  - BONUS_SHARE
  - VOTING_RIGHT
  - CONVERTIBLE_BOND_OPTION
  - PENDING_SHARE_TO_TRADING
  - OTC_BOND_INTEREST
  - COVERED_WARRANT_SETTLEMENT
example: CASH_DIVIDEND
