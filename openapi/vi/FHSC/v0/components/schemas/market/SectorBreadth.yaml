type: object
description: Độ rộng trong một ngành tại phiên hiện tại.
required:
  - sector
  - name
  - advancers
  - decliners
  - unchanged
  - limit_up
  - limit_down
  - total
properties:
  sector:
    type: string
    description: Slug ngành.
    example: financials
  name:
    type: string
    description: Tên ngành.
    example: Tài chính
  advancers:
    type: integer
    description: Số mã tăng giá.
    example: 42
  decliners:
    type: integer
    description: Số mã giảm giá.
    example: 31
  unchanged:
    type: integer
    description: Số mã đứng giá.
    example: 14
  limit_up:
    type: integer
    description: Số mã tăng trần (là tập con của `advancers`).
    example: 3
  limit_down:
    type: integer
    description: Số mã giảm sàn (là tập con của `decliners`).
    example: 1
  total:
    type: integer
    description: Tổng số mã trong ngành. Mã không giao dịch không rơi vào nhóm tăng/giảm/đứng nào, nên ba nhóm không nhất thiết cộng lại bằng `total`.
    example: 87
  updated_at:
    type:
      - string
      - 'null'
    format: date-time
    description: Thời điểm dữ liệu được làm mới lần cuối (ISO 8601 kèm offset), không phải lúc gọi API. `null` khi nguồn không ghi thời điểm.
    example: '2026-08-17T14:30:15+07:00'
