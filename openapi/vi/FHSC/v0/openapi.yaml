openapi: 3.1.0
info:
  title: Finhay Securities Open API
  version: 0.2.0-preview.3
  description: |
    Đặc tả chính thức của Finhay Securities Open API, dùng chung cho SDK
    codegen, Redoc docs, và (sau này) mock server / contract test.

    ## Authentication — 2 tier

    - **Tier 1 — chỉ cần API key**: các endpoint đọc dữ liệu thị trường
      (`GET /market/**`, `GET /trading/market/**`). Gửi kèm header
      `X-FH-APIKEY` là đủ.
    - **Tier 2 — HMAC signing**: các endpoint liên quan đến account /
      trading / user. Gửi kèm 4 header `X-FH-APIKEY` + `X-FH-TIMESTAMP` +
      `X-FH-NONCE` + `X-FH-SIGNATURE`; thêm `X-FH-BODYHASH` khi request có
      body. Chi tiết thuật toán xem extension `x-finhay-signing` ở root
      spec hoặc phần README.

    ## Bootstrap flow

    Gọi 2 endpoint tag **Khởi tạo** (`GET /users/v1/users/me` và
    `GET /users/v1/users/{userId}/sub-accounts`) **1 lần khi khởi tạo
    client** để lấy thông tin `user_id` và `subAccountId`. Mọi endpoint thuộc
    tag **Tổng tài sản / Tiểu khoản / Danh mục đầu tư / Sổ lệnh / Lãi-lỗ /
    Quyền cổ đông** đều cần 2 giá trị này để truyền vào path parameter.
  contact: {}
servers:
  - url: https://open-api.fhsc.com.vn
    description: Production
security:
  - FinhayApiKey: []
tags:
  - name: bootstrap
    description: Khởi tạo client — lấy `user_id` và `subAccountId`. Gọi 1 lần khi khởi tạo SDK rồi cache lại.
    x-group: Khởi tạo
  - name: market-data
    description: Giá stock realtime và lịch sử OHLCV (dạng columnar, phục vụ charting / time-series).
    x-group: Dữ liệu giao dịch
  - name: fundamental-analysis
    description: Chỉ số tài chính cơ bản của doanh nghiệp — chỉ số tổng quan, phân tích theo kỳ và báo cáo tài chính chuẩn (income statement / balance sheet / cash flow).
    x-group: Phân tích cơ bản
  - name: news-events
    description: Sự kiện doanh nghiệp (cổ tức, quyền mua, ĐHCĐ, …), tin tức stock, tin tức tài chính toàn cầu (forex / commodities / economic-indicators / stock-market / cryptocurrency) và báo cáo khuyến nghị từ analyst.
    x-group: Tin tức-sự kiện
  - name: macroeconomics
    description: Chỉ số kinh tế vĩ mô (CPI, PMI, PCE, GDP, …) và lãi suất tiền gửi ngân hàng.
    x-group: Kinh tế vĩ mô
  - name: commodities
    description: Hàng hoá và tài sản thay thế — vàng, bạc (spot / chart / theo nhà cung cấp) và crypto trending.
    x-group: Hàng hoá
  - name: aggregated
    description: Endpoint composite tổng hợp cross-domain (vàng / bạc / crypto / FX / lãi suất / US index) trong 1 call. Nên dùng endpoint chuyên biệt nếu chỉ cần 1 loại.
    x-group: Tổng hợp đa loại
  - name: mutual-funds
    description: Quỹ mở (open-ended funds) — danh sách quỹ, công ty quản lý, NAV history, holdings, ranking và benchmark cross-fund.
    x-group: Quỹ mở
  - name: total-assets
    description: Tổng quan tài sản cấp user — cross-product (stock, fund, bond, hay0) kèm cash, debt, PnL.
    x-group: Tổng tài sản
  - name: sub-account
    description: Thông tin tiểu khoản — số dư, margin, dư nợ và ngân hàng liên kết.
    x-group: Tiểu khoản
  - name: portfolio
    description: Danh mục stock đang nắm giữ kèm giá realtime và PnL theo vị thế.
    x-group: Danh mục đầu tư
  - name: order-book
    description: Quản lý lệnh — sổ lệnh trong ngày, danh sách đầy đủ hoặc chi tiết theo `orderId`.
    x-group: Sổ lệnh
  - name: pnl
    description: PnL và analytics cá nhân — lãi / lỗ trong ngày tổng hợp theo user.
    x-group: Lãi-lỗ
  - name: shareholder-rights
    description: Quyền cổ đông (cổ tức, quyền mua, bỏ phiếu, …) của tiểu khoản.
    x-group: Quyền cổ đông
  - name: trading-session
    description: Hạ tầng trading — trạng thái phiên giao dịch và order type khả dụng của mỗi exchange.
    x-group: Phiên giao dịch
  - name: order-execution
    description: |
      ⚠️ Nhóm endpoint này đang ở giai đoạn **preview**.

      Đặt / sửa / huỷ lệnh trên sàn — write operation nhạy cảm, yêu cầu
      Tier 2 HMAC đầy đủ + `X-FH-BODYHASH` + `X-FH-2FA-TOKEN` (daily 2FA
      session).
    x-group: Thực thi lệnh
  - name: Bảng giá thị trường
    description: Giá realtime, lịch sử, chỉ số và phân tích ngành cho các nhóm tài sản thị trường.
  - name: Tin tức-sự kiện
    description: Tin tức, sự kiện quyền, giao dịch nội bộ và báo cáo phân tích.
