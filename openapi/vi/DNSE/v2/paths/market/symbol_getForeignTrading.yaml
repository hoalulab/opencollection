get:
  operationId: symbol_getForeignTrading
  tags:
    - market
  summary: Dữ liệu nhà đầu tư nước ngoài
  parameters:
    - $ref: ../../components/parameters/XApiKey.yaml
    - $ref: ../../components/parameters/XAuxDate.yaml
    - $ref: ../../components/parameters/XSignature.yaml
    - name: symbol
      in: path
      required: true
      schema:
        type: string
      example: ACB
    - name: boardId
      in: query
      schema:
        $ref: ../../components/schemas/enums/BoardId.yaml
      description: |-
        Mã bảng giao dịch
        - G1: Lô chẵn
        - G4: Lô lẻ
        - T1: Thỏa thuận trong giờ (9h - 14h45)
        - T3: Thỏa thuận sau giờ (14h45 - 15h)
        - T4: Thỏa thuận lô lẻ trong giờ (9h - 14h45)
        - T6: Thỏa thuận lô lẻ sau giờ  (14h45 - 15h)
      example: G1
    - name: from
      in: query
      required: true
      schema:
        type: string
      description: Thời gian bắt đầu (timestamp)
      example: "1785729607"
    - name: to
      in: query
      required: true
      schema:
        type: string
      description: Thời gian kết thúc (timestamp) (không vượt quá 1 ngày)
      example: "1785731407"
    - name: limit
      in: query
      schema:
        type: integer
      example: 100
    - name: order
      in: query
      schema:
        type: string
      example: DESC
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/market/ForeignTradingResponse.yaml
