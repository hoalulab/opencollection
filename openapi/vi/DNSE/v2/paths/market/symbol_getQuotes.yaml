get:
  operationId: symbol_getQuotes
  tags:
    - market
  summary: Lịch sử bid/ask
  parameters:
    - $ref: ../../components/parameters/XApiKey.yaml
    - $ref: ../../components/parameters/XAuxDate.yaml
    - $ref: ../../components/parameters/XSignature.yaml
    - name: symbol
      in: path
      required: true
      schema:
        type: string
      example: ACB
    - name: boardId
      in: query
      schema:
        $ref: ../../components/schemas/enums/BoardId.yaml
      required: true
      description: |-
        Mã bảng giao dịch
        - G1: Lô chẵn
        - G4: Lô lẻ
        - T1: Thỏa thuận trong giờ (9h - 14h45)
        - T3: Thỏa thuận sau giờ (14h45 - 15h)
        - T4: Thỏa thuận lô lẻ trong giờ (9h - 14h45)
        - T6: Thỏa thuận lô lẻ sau giờ  (14h45 - 15h)
      example: G1
    - name: from
      in: query
      required: true
      schema:
        type: string
      description: Thời gian bắt đầu (timestamp)
      example: "1785727927"
    - name: to
      in: query
      required: true
      schema:
        type: string
      description: Thời gian kết thúc (timestamp) (không vượt quá 1 ngày)
      example: "1785735127"
    - name: limit
      in: query
      schema:
        type: integer
      example: 100
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/market/QuotesResponse.yaml
          example:
            quotes:
              - marketId: STO
                boardId: G1
                isin: VN000000ACB8
                symbol: ACB
                bid:
                  - price: 101
                    quantity: 10
                  - price: 100
                    quantity: 50
                  - price: 99.5
                    quantity: 10
                offer:
                  - price: 106
                    quantity: 4870
                  - price: 106.1
                    quantity: 500
                  - price: 110
                    quantity: 30
                totalOfferQtty: 0
                totalBidQtty: 0
                time: "2026-08-03 10:59:12.336"
              - marketId: STO
                boardId: G1
