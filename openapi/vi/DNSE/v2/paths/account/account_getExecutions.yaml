get:
  operationId: account_getExecutions
  tags:
    - account
  summary: Chi tiết trạng thái lệnh
  parameters:
    - $ref: ../../components/parameters/XApiKey.yaml
    - $ref: ../../components/parameters/XAuxDate.yaml
    - $ref: ../../components/parameters/XSignature.yaml
    - name: accountNo
      in: path
      required: true
      schema:
        type: string
      examples:
        STOCK:
          value: "0001179019"
        DERIVATIVE:
          value: "0001179019"
    - name: orderId
      in: path
      required: true
      schema:
        type: string
      examples:
        STOCK:
          value: "1651"
        DERIVATIVE:
          value: "26"
    - name: marketType
      in: query
      required: true
      schema:
        allOf:
          - $ref: ../../components/schemas/enums/MarketType.yaml
        enum:
          - STOCK
          - DERIVATIVE
      description: "Loại thị trường \n- STOCK: Lệnh cơ sở\n- DERIVATIVE: Lệnh phái sinh\n- BOND: Lệnh trái phiếu"
      examples:
        STOCK:
          value: STOCK
        DERIVATIVE:
          value: DERIVATIVE
    - name: orderCategory
      in: query
      schema:
        allOf:
          - $ref: ../../components/schemas/enums/OrderCategory.yaml
        enum:
          - NORMAL
          - CONDITIONAL
      required: true
      description: Phân loại lệnh thường (mặc định NORMAL)
      example: NORMAL
  responses:
