get:
  operationId: position_getPnlConfigs
  tags:
    - account
  summary: Cấu hình chốt lời, cắt lỗ của vị thế
  parameters:
    - $ref: ../../components/parameters/XApiKey.yaml
    - $ref: ../../components/parameters/XAuxDate.yaml
    - $ref: ../../components/parameters/XSignature.yaml
    - name: positionId
      in: path
      required: true
      schema:
        type: string
      example: "177952229647243"
    - name: marketType
      in: query
      required: true
      schema:
        allOf:
          - $ref: ../../components/schemas/enums/MarketType.yaml
        enum:
          - STOCK
          - DERIVATIVE
      description: "Loại thị trường \n- DERIVATIVE: Deal phái sinh\nHiện tại chỉ hỗ trợ phái sinh"
      example: DERIVATIVE
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/trading/PnlConfigsResponse.yaml
          example:
            positionId: 177952229647243
            configs:
              takeProfit:
                enabled: true
                strategy: DELTA_PRICE
                rate: 0.52
                deltaPrice: 162.8
                orderMethod: FASTEST
                orderDeltaPrice: 2
              stopLoss:
                enabled: true
                strategy: PNL_RATE
                rate: -0.34
                deltaPrice: 50.3
                orderMethod: DELTA_PRICE
                orderDeltaPrice: 10.5
                trailingEnabled: true
            createdDate: "2026-06-02T02:47:36.384761Z"
            modifiedDate: "2026-06-03T07:44:44.235941815Z"
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "500":
      $ref: ../../components/responses/InternalError.yaml
post:
  operationId: position_postPnlConfigs
  tags:
    - trading
  summary: Cài đặt chốt lời, cắt lỗ cho vị thế
  parameters:
    - $ref: ../../components/parameters/XApiKey.yaml
    - $ref: ../../components/parameters/XAuxDate.yaml
    - $ref: ../../components/parameters/XSignature.yaml
    - $ref: ../../components/parameters/TradingToken.yaml
    - name: positionId
      in: path
      required: true
      schema:
        type: string
      example: "177952229647243"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/trading/PnlConfigsRequest.yaml
        example:
          takeProfit:
            enabled: true
            strategy: DELTA_PRICE
            rate: 0.52
            deltaPrice: 162.8
            orderMethod: FASTEST
            orderDeltaPrice: 2
          stopLoss:
            enabled: true
            strategy: PNL_RATE
            rate: -0.34
            deltaPrice: 50.3
            orderMethod: DELTA_PRICE
            orderDeltaPrice: 10.5
            trailingEnabled: true
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/trading/PnlConfigsResponse.yaml
          example:
            positionId: 177952229647243
            configs:
              takeProfit:
                enabled: true
                strategy: DELTA_PRICE
                rate: 0.52
                deltaPrice: 162.8
                orderMethod: FASTEST
                orderDeltaPrice: 2
              stopLoss:
                enabled: true
                strategy: PNL_RATE
                rate: -0.34
                deltaPrice: 50.3
                orderMethod: DELTA_PRICE
                orderDeltaPrice: 10.5
                trailingEnabled: true
            createdDate: "2026-06-02T02:47:36.384761Z"
            modifiedDate: "2026-06-03T07:44:44.235941815Z"
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "500":
      $ref: ../../components/responses/InternalError.yaml
