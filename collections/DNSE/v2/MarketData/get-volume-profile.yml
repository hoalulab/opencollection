info:
  name: Volume Profile
  type: http
  seq: 17

http:
  method: GET
  url: "{{baseUrl}}/price/:symbol/trades/volume-profile?boardId=G1&time=2026-09-25"
  params:
    - name: boardId
      value: G1
      type: query
      description: "Mã bảng giao dịch"
    - name: time
      value: "2026-09-25"
      type: query
      description: "Ngày giao dịch cần lấy dữ liệu (YYYY-MM-DD)"
    - name: symbol
      value: "{{symbol}}"
      type: path
      description: "Mã chứng khoán"
  headers:
    - name: X-API-Key
      value: "{{apiKey}}"
    - name: X-Aux-Date
      value: "{{auxDate}}"
    - name: X-Signature
      value: "{{signature}}"
    - name: version
      value: "{{version}}"
  auth: inherit

runtime:
  variables:
    - name: symbol
      value: ACB
    - name: version
      value: "2026-09-25"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Thống kê khối lượng mua và bán chủ động tại từng mức giá trong ngày giao dịch.
