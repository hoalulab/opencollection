name: OpenAPI Build

on:
  push:
    paths:
      - "openapi/**"
      - "asyncapi/**"
      - "package.json"
      - "redocly.yaml"
      - ".github/workflows/openapi-build.yaml"
  pull_request:
    paths:
      - "openapi/**"
      - "asyncapi/**"
      - "package.json"
      - "redocly.yaml"
      - ".github/workflows/openapi-build.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lint and bundle OpenAPI specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Build specs
        run: npm run build

      - name: Upload bundled specs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi-bundles
          path: dist/
          if-no-files-found: error
          retention-days: 14
